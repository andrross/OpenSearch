opensearchplugin {
  description = 'DataFusion native execution engine plugin for the query engine.'
  classname = 'org.opensearch.be.datafusion.DataFusionPlugin'
  extendedPlugins = ['analytics-engine']
}

def buildType = project.hasProperty('rustDebug') ? 'debug' : 'release'

dependencies {
  // Provided at runtime by the parent analytics-engine plugin; compile-only to avoid jar hell.
  compileOnly project(':sandbox:libs:analytics-framework')

  compileOnly "org.apache.logging.log4j:log4j-api:${versions.log4j}"
  compileOnly "org.apache.logging.log4j:log4j-core:${versions.log4j}"

  // TODO: check if the dependencies need to be in analytics plugin
  // Apache Arrow dependencies
  implementation "org.apache.arrow:arrow-memory-core:18.3.0"
  implementation "org.apache.arrow:arrow-memory-unsafe:18.3.0"
  implementation "org.apache.arrow:arrow-vector:18.3.0"
  implementation "org.apache.arrow:arrow-c-data:18.3.0"
  implementation "org.apache.arrow:arrow-format:18.3.0"
  implementation "com.google.flatbuffers:flatbuffers-java:${versions.flatbuffers}"
  implementation "org.slf4j:slf4j-api:${versions.slf4j}"
  implementation "org.checkerframework:checker-qual:3.43.0"

  // Jackson — required by Arrow's schema import (C Data Interface)
  implementation "com.fasterxml.jackson.core:jackson-core:${versions.jackson}"
  implementation "com.fasterxml.jackson.core:jackson-annotations:${versions.jackson_annotations}"
  implementation "com.fasterxml.jackson.core:jackson-databind:${versions.jackson_databind}"
}

// Resolve protoc binary and well-known type includes for the Rust/substrait build
def protocConfig = project.configurations.create("protocBinary") {
  canBeConsumed = false
  canBeResolved = true
}
def protocIncludeConfig = project.configurations.create("protocInclude") {
  canBeConsumed = false
  canBeResolved = true
}
def protocVersion = libs.versions.protobuf.get()
def osClassifier = {
  def os = System.getProperty('os.name').toLowerCase()
  def arch = System.getProperty('os.arch')
  if (os.contains('mac')) {
    return arch.contains('aarch64') ? 'osx-aarch_64' : 'osx-x86_64'
  } else if (os.contains('linux')) {
    return arch.contains('aarch64') ? 'linux-aarch_64' : 'linux-x86_64'
  }
  return 'linux-x86_64'
}()
dependencies {
  protocBinary("com.google.protobuf:protoc:${protocVersion}:${osClassifier}@exe")
  protocInclude("com.google.protobuf:protobuf-java:${protocVersion}")
}

// Extract well-known .proto files from protobuf-java jar
def protocIncludeDir = layout.buildDirectory.dir("protoc-include")
task extractProtocIncludes(type: Copy) {
  from { zipTree(protocIncludeConfig.singleFile) }
  include 'google/**/*.proto'
  into protocIncludeDir
}

// Rust native library build
task buildRustLibrary(type: Exec, dependsOn: extractProtocIncludes) {
  description = 'Build the Rust JNI library using Cargo'
  group = 'build'
  workingDir file('jni')

  def cargoExecutable = 'cargo'
  [System.getenv('HOME') + '/.cargo/bin/cargo', '/usr/local/bin/cargo'].each { path ->
    if (new File(path).exists()) { cargoExecutable = path }
  }

  def cargoArgs = [cargoExecutable, 'build']
  if (buildType == 'release') { cargoArgs.add('--release') }
  commandLine cargoArgs

  environment 'CARGO_TARGET_DIR', file('target').absolutePath
  environment 'PROTOC', protocConfig.singleFile.absolutePath
  environment 'PROTOC_INCLUDE', protocIncludeDir.get().asFile.absolutePath
  inputs.files fileTree('jni/src')
  inputs.file 'jni/Cargo.toml'
}

task copyNativeLibrary(type: Copy, dependsOn: buildRustLibrary) {
  description = 'Copy the native library to Java resources'
  group = 'build'

  def osName = System.getProperty('os.name').toLowerCase()
  def libExtension = osName.contains('mac') ? '.dylib' : '.so'

  from file("target/${buildType}/libopensearch_datafusion_jni${libExtension}")
  into file('src/main/resources/native')
  filePermissions { unix(0644) }
}

compileJava.dependsOn copyNativeLibrary
processResources.dependsOn copyNativeLibrary
sourcesJar.dependsOn copyNativeLibrary

// copyNativeLibrary writes into src/main/resources/native — any task that scans
// the source tree must run after it to satisfy Gradle's implicit-dependency check.
tasks.named("forbiddenPatterns").configure {
  dependsOn copyNativeLibrary
  exclude '**/native/**'
  exclude '**/*.parquet'
}

for (def taskName : ["filepermissions", "spotlessJava", "spotlessJavaCheck"]) {
  tasks.named(taskName).configure { dependsOn copyNativeLibrary }
}

clean {
  delete file('target')
  delete file('src/main/resources/native')
}

test {
  jvmArgs += ["--add-opens", "java.base/java.nio=org.apache.arrow.memory.core,ALL-UNNAMED"]
  systemProperty 'java.library.path', file('src/main/resources/native').absolutePath
}

tasks.withType(JavaCompile).configureEach {
  // Arrow references Jackson annotations not on classpath — harmless warnings
  options.compilerArgs -= '-Werror'
}

// TODO: Remove once back-end is built out with test suite
testingConventions.enabled = false

tasks.named('thirdPartyAudit').configure {
  ignoreViolations(
    'org.apache.arrow.memory.util.MemoryUtil',
    'org.apache.arrow.memory.util.MemoryUtil$1'
  )
}
