syntax = "proto3";
package org.opensearch.common.io.stream.proto;

option java_outer_classname = "NamedWriteableProto";

// Frame for a org.opensearch.core.common.io.stream.NamedWriteable: an
// extension point whose concrete type is chosen at runtime from a registry
// (Task.Status, QueryBuilder, AggregationBuilder, ...), possibly by a plugin.
//
// The frame is protobuf; the payload is whatever the named class writes. An
// unmodified class writes its StreamOutput layout into a nested stream pinned
// to the peer's version, so its own version rules keep working. A class that
// implements ProtobufPayload writes its protobuf message instead, by its own
// decision, without the frame or the container knowing.
message NamedWriteable {
  // NamedWriteable.getWriteableName(): the registry key.
  optional string name = 1;
  // The class's own bytes, read back with the reader registered under `name`.
  optional bytes payload = 2;
}
