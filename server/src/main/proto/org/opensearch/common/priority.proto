syntax = "proto3";
package org.opensearch.common.proto;

option java_outer_classname = "PriorityProto";

// Wire form of org.opensearch.common.Priority.
enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_IMMEDIATE = 1;
  PRIORITY_URGENT = 2;
  PRIORITY_HIGH = 3;
  PRIORITY_NORMAL = 4;
  PRIORITY_LOW = 5;
  PRIORITY_LANGUID = 6;
}
