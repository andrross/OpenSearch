syntax = "proto3";
package org.opensearch.cluster.health.proto;

import "org/opensearch/cluster/health/cluster_health_status.proto";

option java_outer_classname = "ClusterShardHealthProto";

// Wire form of org.opensearch.cluster.health.ClusterShardHealth.
message ClusterShardHealth {
  optional int32 shard_id = 1;
  optional ClusterHealthStatus status = 2;
  optional int32 active_shards = 3;
  optional int32 relocating_shards = 4;
  optional int32 initializing_shards = 5;
  optional int32 unassigned_shards = 6;
  optional int32 delayed_unassigned_shards = 7;
  optional bool primary_active = 8;
}
