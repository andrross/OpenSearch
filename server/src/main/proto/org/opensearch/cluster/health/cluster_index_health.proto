syntax = "proto3";
package org.opensearch.cluster.health.proto;

import "org/opensearch/cluster/health/cluster_health_status.proto";
import "org/opensearch/cluster/health/cluster_shard_health.proto";

option java_outer_classname = "ClusterIndexHealthProto";

// Wire form of org.opensearch.cluster.health.ClusterIndexHealth.
message ClusterIndexHealth {
  optional string index = 1;
  optional int32 number_of_shards = 2;
  optional int32 number_of_replicas = 3;
  optional int32 active_primary_shards = 4;
  optional int32 active_shards = 5;
  optional int32 relocating_shards = 6;
  optional int32 initializing_shards = 7;
  optional int32 unassigned_shards = 8;
  // Not carried by the legacy wire format; the legacy reader always sees 0.
  optional int32 delayed_unassigned_shards = 9;
  optional ClusterHealthStatus status = 10;
  // Keyed by shard id. Empty unless shard-level health was requested.
  map<int32, ClusterShardHealth> shards = 11;
}
