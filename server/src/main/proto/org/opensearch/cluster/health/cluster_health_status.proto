syntax = "proto3";
package org.opensearch.cluster.health.proto;

option java_outer_classname = "ClusterHealthStatusProto";

// Wire form of org.opensearch.cluster.health.ClusterHealthStatus.
enum ClusterHealthStatus {
  CLUSTER_HEALTH_STATUS_UNSPECIFIED = 0;
  CLUSTER_HEALTH_STATUS_GREEN = 1;
  CLUSTER_HEALTH_STATUS_YELLOW = 2;
  CLUSTER_HEALTH_STATUS_RED = 3;
}
