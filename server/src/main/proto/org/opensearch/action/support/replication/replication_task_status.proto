syntax = "proto3";
package org.opensearch.action.support.replication.proto;

option java_outer_classname = "ReplicationTaskStatusProto";

// Wire form of org.opensearch.action.support.replication.ReplicationTask.Status,
// a Task.Status registered under the name "replication".
message ReplicationTaskStatus {
  optional string phase = 1;
}
