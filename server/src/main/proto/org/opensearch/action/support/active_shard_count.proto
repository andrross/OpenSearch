syntax = "proto3";
package org.opensearch.action.support.proto;

option java_outer_classname = "ActiveShardCountProto";

// Wire form of org.opensearch.action.support.ActiveShardCount.
// The legacy encoding uses -1 (ALL) and -2 (DEFAULT) as sentinels in the count;
// here they are explicit so a reader never has to know the magic numbers.
message ActiveShardCount {
  enum Sentinel {
    SENTINEL_UNSPECIFIED = 0;
    SENTINEL_ALL = 1;
    SENTINEL_DEFAULT = 2;
  }

  oneof kind {
    // A non-negative shard copy count. 0 corresponds to ActiveShardCount.NONE.
    int32 count = 1;
    Sentinel sentinel = 2;
  }
}
