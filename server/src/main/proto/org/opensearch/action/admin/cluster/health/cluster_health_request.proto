syntax = "proto3";
package org.opensearch.action.admin.cluster.health.proto;

import "org/opensearch/action/support/active_shard_count.proto";
import "org/opensearch/action/support/indices_options.proto";
import "org/opensearch/cluster/health/cluster_health_status.proto";
import "org/opensearch/common/priority.proto";
import "org/opensearch/common/unit/time_value.proto";

option java_outer_classname = "ClusterHealthRequestProto";

// Wire form of org.opensearch.action.admin.cluster.health.ClusterHealthRequest.
//
// Fields shared by every cluster-manager request (parent task, cluster manager
// timeout, local) are carried by the transport envelope, not by this message.
message ClusterHealthRequest {
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    LEVEL_CLUSTER = 1;
    LEVEL_INDICES = 2;
    LEVEL_SHARDS = 3;
    LEVEL_AWARENESS_ATTRIBUTES = 4;
  }

  repeated string indices = 1;
  org.opensearch.action.support.proto.IndicesOptions indices_options = 2;
  org.opensearch.common.unit.proto.TimeValue timeout = 3;
  optional org.opensearch.cluster.health.proto.ClusterHealthStatus wait_for_status = 4;
  optional bool wait_for_no_relocating_shards = 5;
  optional bool wait_for_no_initializing_shards = 6;
  org.opensearch.action.support.proto.ActiveShardCount wait_for_active_shards = 7;
  optional string wait_for_nodes = 8;
  optional org.opensearch.common.proto.Priority wait_for_events = 9;
  optional bool ensure_node_weighed_in = 10;
  optional Level level = 11;
  optional bool apply_level_at_transport_layer = 12;
  optional string awareness_attribute = 13;
}
