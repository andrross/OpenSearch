syntax = "proto3";
package org.opensearch.tasks.proto;

option java_outer_classname = "TaskIdProto";

// Wire form of org.opensearch.core.tasks.TaskId.
// TaskId.EMPTY_TASK_ID is an absent message, not a message with empty fields.
message TaskId {
  optional string node_id = 1;
  optional int64 id = 2;
}
